[project]
name = "conversational-bi-backend"
version = "0.1.0"
description = "Conversational BI backend - multi-tenant agentic data query platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "authlib>=1.3.2",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "cryptography>=44.0.0",
    "langchain>=0.3.14",
    "langchain-google-genai>=2.0.8",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.60",
    "langsmith>=0.2.0",
    "psycopg2-binary>=2.9.10",
    "aiomysql>=0.2.0",
    "motor>=3.6.0",
    "elasticsearch[async]>=8.17.0",
    "sqlparse>=0.5.3",
    "python-multipart>=0.0.18",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI dependency injection uses Depends() in parameter defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Agent nodes and connectors surface user-facing errors from any failure mode.
"app/agents/**" = ["BLE001"]
"app/connectors/**" = ["BLE001", "S110"]
